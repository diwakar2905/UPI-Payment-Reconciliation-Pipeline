version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: orders
        description: Bronze copy of app.orders, loaded per run_date by ingestion/load.py.
        columns:
          - name: order_id
            tests: [not_null]
      - name: gateway_events
        description: Daily gateway CSV events, loaded per run_date.
        columns:
          - name: txn_id
            tests: [not_null]
      - name: settlements
        description: Daily settlement CSV records, loaded per run_date (may lag order date).
        columns:
          - name: settlement_id
            tests: [not_null]
      - name: rejected
        description: Dead-letter table for rows that failed validation.
      - name: pipeline_runs
        description: Execution audit and row-count metrics per pipeline step.

  - name: app
    schema: app
    tables:
      - name: merchants
      - name: orders
